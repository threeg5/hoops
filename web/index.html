<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HOOPS — NBA team desk</title>
    <meta
      name="description"
      content="NBA team research desk: tonight's games, recent points, rest, injuries, expected score, and a live play log."
    />
    <link rel="icon" href="%BASE_URL%hoops-mark.jpg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root { margin: 0; min-height: 100%; background: #07111f; color: #f6f3ec; }
      #root { font-family: "Segoe UI", sans-serif; padding: 2rem; }
    </style>
  </head>
  <body>
    <div id="root">Loading HOOPS…</div>
    <script>
      if (location.pathname.replace(/\/+$/, "").endsWith("/whoops")) {
        document.title = "W-HOOPS — WNBA team desk";
        var root = document.getElementById("root");
        if (root) root.textContent = "Loading W-HOOPS…";
        var about = document.querySelector('meta[name="description"]');
        if (about) about.setAttribute("content", "WNBA team research desk: tonight's games, recent points, rest, injuries, expected score, and a live play log.");
      }
      if (location.pathname.replace(/\/+$/, "").endsWith("/collegehoops")) {
        document.title = "College Hoops — college basketball desk";
        var collegeRoot = document.getElementById("root");
        if (collegeRoot) collegeRoot.textContent = "Loading College Hoops…";
        var collegeAbout = document.querySelector('meta[name="description"]');
        if (collegeAbout) collegeAbout.setAttribute("content", "College basketball research desk: tonight's games, recent points, rest, injuries, expected score, and a live play log.");
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
